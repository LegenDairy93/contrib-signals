[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forkyssey"
version = "0.2.0"
description = "Evidence-first upstream quest discovery for GitHub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devaanga Prakash" }]
dependencies = []

[project.scripts]
forkyssey = "forkyssey.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forkyssey = ["data/*.sql"]
